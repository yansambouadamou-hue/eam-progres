items:
  - num: "01"
    title: "Eau, hygiène et assainissement"
    description: "Accès à l'eau potable, promotion de l'hygiène et assainissement durable. Postes d'eau autonomes, kits de potabilisation, latrines d'urgence, ATPC et certification FDAL."
  - num: "02"
    title: "Santé et nutrition communautaire"
    description: "Prévention et prise en charge communautaire. PCIMA, ANJE, groupes de soutien et appui aux relais communautaires."
  - num: "03"
    title: "Sécurité alimentaire et moyens d'existence"
    description: "Appui aux ménages à travers les activités génératrices de revenus, l'autonomisation économique et le relèvement des moyens d'existence."
  - num: "04"
    title: "Réponse d'urgence"
    description: "Réponses multisectorielles aux crises et mouvements de population, avec distribution de kits WASH, kits AGR et enquêtes post-distribution."
  - num: "05"
    title: "Gouvernance locale"
    description: "Participation communautaire, concertation et redevabilité à travers les cadres de concertation, les comités de plainte et les mécanismes de retour d'information."
  - num: "06"
    title: "Genre et protection"
    description: "Participation et leadership des femmes, droits, protection des femmes et des enfants et prévention non violente des conflits."
