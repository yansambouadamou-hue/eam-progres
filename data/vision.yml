vision: "Devenir une organisation de référence, crédible et pérenne, reconnue pour la qualité de ses services auprès des populations et de ses partenaires."
mission: "Concrétiser les engagements de l'État aux côtés des communautés, pour poser les bases d'une société juste, équitable et tournée vers un développement durable."
valeurs: "Équité, dignité, responsabilité, redevabilité et transparence — envers les partenaires comme envers les bénéficiaires."
gouvernance: "L'Assemblée Générale reste l'organe souverain. Le Conseil d'Administration, composé de cinq membres élus pour un mandat de trois ans, se réunit chaque trimestre. Il exécute les décisions de l'AG, prépare le budget annuel et veille à la bonne marche de l'association. Le mandat d'un membre du CA n'est renouvelable que trois fois, sauf plébiscite."
